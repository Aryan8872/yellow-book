name: Continuous Flutter Build & Firebase Distribution

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Web Release
        run: flutter build web --release --dart-define=BASE_URL=https://yellow-bookapi-production.up.railway.app/api/v1

      - name: Decode Release Keystore from GitHub Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/app-release-key.jks

      - name: Build Android Release APK
        run: flutter build apk --release --dart-define=BASE_URL=https://yellow-bookapi-production.up.railway.app/api/v1

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: entertainer-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Delete existing 'latest' release & tag (so APK asset is always replaced)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Direct Release APK on GitHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Tester Build"
          body: "Direct APK build from GitHub Actions for in-app auto updates."
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
