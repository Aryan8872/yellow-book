name: Continuous Flutter Build & Firebase Distribution

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Web Release
        run: flutter build web --release

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: entertainer-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Delete existing 'latest' release & tag (so APK asset is always replaced)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Direct Release APK on GitHub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Tester Build"
          body: "Direct APK build from GitHub Actions for in-app auto updates."
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional Firebase App Distribution Step (Requires FIREBASE_TOKEN & FIREBASE_ANDROID_APP_ID secrets in GitHub Repository Settings)
      # - name: Upload APK to Firebase App Distribution
      #   if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      #   uses: w9jds/firebase-action@v13.4.0
      #   with:
      #     args: appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk --app ${{ secrets.FIREBASE_ANDROID_APP_ID }} --groups "testers"
      #   env:
      #     FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
